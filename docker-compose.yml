name: paper-trading-backend

services:
  postgres:
    image: postgres:17-alpine
    container_name: paper-trading-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache only: everything in it can be rebuilt from Postgres, so no volume
  redis:
    image: redis:8-alpine
    container_name: paper-trading-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message broker. Management UI: http://localhost:15672
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: paper-trading-rabbitmq
    environment:
      # Not "guest": RabbitMQ only lets guest log in from inside the container
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-trading}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change_me}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  # One-shot job: applies pending migrations and seeds the stocks, then exits.
  # The API waits for it to finish successfully before starting.
  migrate:
    profiles: ['app']
    build:
      context: .
      target: migrate
    container_name: paper-trading-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  # Not started by a plain "docker compose up": during development the API runs
  # locally with "npm run dev". To run it in Docker: docker compose --profile app up -d --build
  api:
    profiles: ['app']
    build:
      context: .
      target: production
    container_name: paper-trading-api
    # tini as PID 1: forwards SIGTERM to Node so the graceful shutdown runs
    init: true
    environment:
      PORT: 3000
      # Inside Docker, the database host is the service name "postgres", not localhost
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-trading}:${RABBITMQ_PASSWORD:-change_me}@rabbitmq:5672
    ports:
      - "${PORT}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data: