# Runs on every push to main and every pull request: if anything here fails,
# the commit is marked red on GitHub before it can break main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless: cancel it
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read the code, nothing else (least privilege)
permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, unit + e2e tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    # The e2e tests run the whole app against real PostgreSQL, Redis and
    # RabbitMQ: the same images as docker-compose.yml, started next to the job
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: paper_trading
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trading"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: trading
          RABBITMQ_DEFAULT_PASS: ci_password
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 10

    # Throwaway values for throwaway containers: nothing here is a real secret.
    # test:e2e:prepare derives the test database (paper_trading_test) from
    # DATABASE_URL, and the e2e tests use Redis db 1, as on a laptop.
    # No MARKET_DATA_PROVIDER: the simulated prices, no Alpaca keys needed.
    env:
      DATABASE_URL: postgresql://trading:ci_password@localhost:5432/paper_trading?schema=public
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://trading:ci_password@localhost:5672
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Reuses downloaded packages between runs (keyed on the lockfile)
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # ci, not install: exactly the lockfile, and fails if it's out of date
      - run: npm ci

      # src/generated/prisma is gitignored: build it from schema.prisma
      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check (tests included)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

      - name: Prepare the e2e database (create, migrate, seed)
        run: npm run test:e2e:prepare

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (lint, tests, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Vitest + React Testing Library, in jsdom (no browser, no backend)
      - name: Tests
        run: npm test

      # tsc -b (type check) && vite build
      - name: Type check and build
        run: npm run build

  docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Builds the production image the way docker compose --profile app
      # does, so a broken Dockerfile is caught here and not on deploy day.
      # Nothing is pushed anywhere.
      - name: Build the production image
        run: docker build --target production --tag paper-trading-api:ci backend
